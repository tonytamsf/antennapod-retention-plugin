plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.antennapodretentionplugin'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.antennapodretentionplugin'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'

    // The AntennaPod "plugin SDK": the AIDL contract plus the PluginContract,
    // PluginRetentionRequest, PluginRetentionResult and PluginEpisodeInfo Java classes
    // (package de.danoeh.antennapod.plugin.host). Copy them from AntennaPod's :plugin:host
    // module, or depend on the published SDK artifact once available.
}
